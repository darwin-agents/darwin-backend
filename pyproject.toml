[project]
name = "darwin-backend"
version = "0.1.0"
description = "Darwin Agents — The God Layer (Phase 1 MVP)"
requires-python = ">=3.12"

dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "supabase>=2.5.0",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.0",
    "celery[redis,gevent]>=5.4.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "stripe>=9.12.0",
    "anthropic>=0.28.0",
    "openai>=1.40.0",
    "modal>=0.64.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.2.0",
    "croniter>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "fakeredis>=2.35.1",
    "freezegun>=1.5.5",
    "pytest-mock>=3.15.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]   # FastAPI Depends() in defaults

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
